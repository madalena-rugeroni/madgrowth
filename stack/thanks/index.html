  <section>

      <div class="thanks">
        <span class="eyebrow">The Stack</span>
        <h1>You're in. Thank you.</h1>
        <p>Your payment went through and your order is confirmed.</p>

        <!--
          DELIVERY COPY — Madalena, replace the paragraph below with how The
          Stack actually reaches the buyer (emailed link, download, Gumroad,
          repo invite, whatever it is). It is left deliberately vague because

          Do not point the Stripe Payment Link at this page until that

<script src="../../assets/js/main.js" defer></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var order = params.get("order") || "";

  if (order) {
    var line = document.getElementById("order-line");
    line.textContent = "Order reference: " + order;
    line.hidden = false;
  }

  // Stripe redirects here after payment with the checkout session id, so
  // landing here with an order id is this site's only signal that a sale
  // happened. Recorded once per order, so a refresh does not double-count.
  //
  // Stopgap, same caveats as the Read intake page: it misses anyone who
  // closes the tab before the redirect, and the URL can be visited directly.
  // PostHog's native Stripe source is the authoritative record.
  (function reportPurchase() {
    if (!order) return;
    var KEY = "mg_purchase_" + order;
    try { if (window.localStorage && localStorage.getItem(KEY)) return; } catch (e) {}
    function send() {
      if (!window.MGutil || typeof window.MGutil.track !== "function") return false;
      window.MGutil.track("purchase", {
        product: "the_stack",
        product_name: "The Stack",
        value: 299,
        currency: "EUR",
        order_id: order,
        source: "stripe_redirect"
      });
      try { if (window.localStorage) localStorage.setItem(KEY, "1"); } catch (e) {}
      return true;
    }
    if (send()) return;
    var tries = 0;
    var t = setInterval(function () {
      if (send() || ++tries > 40) clearInterval(t);
    }, 100);
  })();
})();
</script>
</body>
</html>
